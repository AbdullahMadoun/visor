<!doctype html><html><head><meta charset="utf-8"><title>Check</title></head>
<body style="font: 20px Helvetica, Arial, sans-serif; margin: 40px">
  <div id="wall"><h2>Verify you are human</h2><p>Complete the security check to continue.</p></div>
  <button id="go" style="display:none; font-size:18px; padding:8px 16px" onclick="document.getElementById('log').textContent='through'">Continue to site</button>
  <div id="log">blocked</div>
  <script>  // stands in for the person solving the captcha
    setTimeout(() => { document.getElementById('wall').remove(); document.getElementById('go').style.display = 'inline'; }, 2500);
  </script>
</body></html>
