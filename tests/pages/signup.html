<!doctype html><html><head><meta charset="utf-8"><title>Signup</title></head>
<body style="font: 20px Helvetica, Arial, sans-serif; margin: 40px">
  <h2>Book club</h2>
  <form id="f" onsubmit="event.preventDefault(); go()">
    <p><label for="email">Email</label> <input id="email" style="font-size:20px"></p>
    <p><label for="pw">Password</label> <input id="pw" type="password" style="font-size:20px"></p>
    <p><label for="plan">Plan</label>
       <select id="plan" style="font-size:20px"><option>Monthly</option><option>Yearly</option></select></p>
    <button style="font-size:20px;padding:6px 16px">Join club</button>
  </form>
  <p id="status" style="font-size:24px"></p>
  <script>
    function go() {
      const ok = document.getElementById('email').value.includes('@') && document.getElementById('pw').value;
      document.getElementById('status').textContent = ok ? 'Welcome aboard' : 'Check your details';
    }
  </script>
</body></html>
