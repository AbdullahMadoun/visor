<!doctype html><html><head><meta charset="utf-8"><title>Goal</title></head>
<body style="font: 22px Helvetica, Arial, sans-serif; margin: 40px">
  <h2>Weekly meetup</h2>
  <!-- Join shows its result a moment later; Nothing does nothing at all -->
  <button onclick="setTimeout(() => document.getElementById('status').textContent = 'Request sent', 600)"
          style="font-size:22px;padding:8px 18px">Join</button>
  <button style="font-size:22px;padding:8px 18px;margin-left:16px">Nothing</button>
  <p id="status" style="font-size:26px"></p>
</body></html>
